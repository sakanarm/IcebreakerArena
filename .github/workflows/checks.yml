name: checks

# Everything that needs no browser: the types, the unit tests, the production build, and a whole game played
# by a crowd of bots and checked against the report the Host reads at the end. Runs on every push and PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: types, tests and build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 20.x is what the production box runs, 22.x is what the laptops run: a change must suit both
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  crowd:
    name: a game played by a crowd of bots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci

      - name: start the game server
        run: |
          npm start -w @icebreaker/server > "$RUNNER_TEMP/game-server.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:4000/health >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo 'the game server did not answer /health'
          cat "$RUNNER_TEMP/game-server.log"
          exit 1

      # 200 players in one room: a four-core runner plays this comfortably, and it is already enough to catch
      # a change that breaks scoring, the flow, or how much a single player is sent
      - name: play it
        run: npm run crowd -- --players=200

      - name: the game server's log
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/game-server.log"
