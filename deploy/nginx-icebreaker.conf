# MFEC Pika Arena at /PikaArena on a shared nginx site.
#
# The file keeps its old name on purpose. A line in the site's locations snippet — a file this box's
# other apps share — includes it by its full path, and that snippet is not ours to edit for a
# cosmetic reason. Renaming this file would leave that include pointing at nothing, `nginx -t` would
# fail, and the next reload or reboot would take every app on the box down with it.
#
# These are location blocks for an existing server { } block: deploy/nginx-enable.sh includes
# this file from the site's locations snippet. pm2 runs the app on loopback only:
#   web (Next.js, built with basePath /PikaArena)  127.0.0.1:4231
#   game server (Socket.IO)                       127.0.0.1:4232
# After editing this file: sudo nginx -t && sudo systemctl reload nginx

# Game server: WebSocket, with long-polling as the fallback. The server listens at /socket.io/,
# so the /PikaArena prefix is stripped. Its /health and /info stay private.
location ^~ /PikaArena/socket.io/ {
    proxy_pass http://127.0.0.1:4232/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    # the Host sends a whole game in one message of up to 512 KiB (maxHttpBufferSize)
    client_max_body_size 1m;
}

# Web app: Next.js already knows its basePath, so the URI goes through unchanged.
# The exact match keeps /PikaArena itself away from the redirect at the bottom.
location = /PikaArena {
    proxy_pass http://127.0.0.1:4231;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /PikaArena/ {
    proxy_pass http://127.0.0.1:4231;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Every other spelling, and the name this app had until November 2026, land on the canonical path:
# /pikaarena, /IceBreaker, /icebreakerarena/play?pin=... and the links already handed out.
#
# These two are the only regex locations on this box, and nginx tries every regex location before it
# falls back to a plain prefix one. So they are anchored to whole names of ours — pikaarena and
# icebreaker — and never to a bare /pika: /Pika/ and /PikaScrape/ belong to other teams, and a
# pattern loose enough to reach them would quietly swallow their apps.
#
# $uri is already percent-decoded, so only plain path characters go into the Location header:
# /IceBreaker/%0DSet-Cookie:... would otherwise put a raw CR there. Other paths get /PikaArena/.
location ~* "^/(?:pikaarena|icebreaker(?:arena)?)(?<arena_rest>/[A-Za-z0-9._~/-]*)?$" {
    return 301 /PikaArena$arena_rest$is_args$args;
}

location ~* "^/(?:pikaarena|icebreaker(?:arena)?)/" {
    return 301 /PikaArena/$is_args$args;
}
