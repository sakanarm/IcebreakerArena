# MFEC IceBreaker Arena at /icebreaker on a shared nginx site.
# These are location blocks for an existing server { } block: deploy/nginx-enable.sh includes
# this file from the site's locations snippet. pm2 runs the app on loopback only:
#   web (Next.js, built with basePath /icebreaker)  127.0.0.1:4231
#   game server (Socket.IO)                         127.0.0.1:4232
# After editing this file: sudo nginx -t && sudo systemctl reload nginx

# Game server: WebSocket, with long-polling as the fallback. The server listens at /socket.io/,
# so the /icebreaker prefix is stripped. Its /health and /info stay private.
location ^~ /icebreaker/socket.io/ {
    proxy_pass http://127.0.0.1:4232/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    # the Host sends a whole game in one message of up to 512 KiB (maxHttpBufferSize)
    client_max_body_size 1m;
}

# Web app: Next.js already knows its basePath, so the URI goes through unchanged.
# The exact match keeps /icebreaker itself away from the redirect at the bottom.
location = /icebreaker {
    proxy_pass http://127.0.0.1:4231;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /icebreaker/ {
    proxy_pass http://127.0.0.1:4231;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# /IceBreaker, /IceBreakerArena/play?pin=... and other spellings land on the canonical path.
# $uri is already percent-decoded, so only plain path characters go into the Location header:
# /IceBreaker/%0DSet-Cookie:... would otherwise put a raw CR there. Other paths get /icebreaker/.
location ~* "^/icebreaker(?:arena)?(?<icebreaker_rest>/[A-Za-z0-9._~/-]*)?$" {
    return 301 /icebreaker$icebreaker_rest$is_args$args;
}

location ~* "^/icebreaker(?:arena)?/" {
    return 301 /icebreaker/$is_args$args;
}
